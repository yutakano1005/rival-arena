<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライバル・アリーナ 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI","Yu Gothic UI",sans-serif;color:#eee;user-select:none;}
  canvas{display:block;}
  #hud{position:fixed;inset:0;pointer-events:none;}
  #score{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:rgba(0,0,0,.45);padding:6px 22px;border-radius:8px;}
  #score .n{font-size:30px;font-weight:800;}
  #sp{color:#4cc9f0}#sr{color:#ff4d6d}
  #roundinfo{text-align:center;font-size:13px;font-weight:700;line-height:1.3}
  #rivalbar{position:absolute;top:70px;left:50%;transform:translateX(-50%);width:240px;font-size:12px;font-weight:700;color:#ff8fa3;text-align:center}
  .bar{height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;width:100%;background:#ff4d6d;transition:width .1s}
  #weapon{position:absolute;right:24px;bottom:22px;text-align:right;background:rgba(0,0,0,.4);padding:10px 16px;border-radius:8px}
  #wname{font-size:18px;font-weight:800}
  #ammo{font-size:28px;font-weight:800}
  #ammo small{font-size:15px;opacity:.7}
  #hpbox{position:absolute;left:24px;bottom:22px;width:260px;background:rgba(0,0,0,.4);padding:10px 16px;border-radius:8px;font-weight:800}
  #hpbox .bar{height:10px}
  #php{background:#06d6a0 !important}
  #slots{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px}
  .slot{position:relative;width:74px;height:74px;border-radius:12px;border:3px solid transparent;opacity:.55;transition:all .12s}
  .slot.on{opacity:1;border-color:#fff;transform:translateY(-6px)}
  .slot img{position:absolute;left:-10%;top:-14%;width:120%;filter:drop-shadow(0 2px 3px #000)}
  .slot b{position:absolute;left:6px;top:3px;font-size:14px;text-shadow:0 1px 3px #000}
  .slot .cnt{position:absolute;right:6px;bottom:3px;font-size:14px;font-weight:800;text-shadow:0 1px 3px #000}
  #cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #hitmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#fff;opacity:0;text-shadow:0 0 4px #000}
  #scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0,transparent 33vh,#000 33.3vh)}
  #scope:before,#scope:after{content:"";position:absolute;background:#000}
  #scope:before{left:0;right:0;top:50%;height:2px;margin-top:-1px}
  #scope:after{top:0;bottom:0;left:50%;width:2px;margin-left:-1px}
  #vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,0,0,.75) 100%);opacity:0}
  #heal{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,220,120,.5) 100%);opacity:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}
  #banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:38px;font-weight:900;text-shadow:0 2px 10px #000;display:none}
  #banner .big{font-size:72px}
  #sub{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 18px;border-radius:6px;font-size:18px;display:none;white-space:nowrap}
  #sub b{color:#ff4d6d}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.72);cursor:pointer}
  #ovbox{text-align:center;max-width:820px;padding:20px}
  #ovbox h1{font-size:60px;margin:0 0 8px;color:#ff4d6d;letter-spacing:2px}
  #ovbox p{font-size:17px;line-height:1.7;margin:6px 0}
  .keys{color:#ffd166}
  .go{margin-top:26px;font-size:22px;font-weight:800;animation:bl 1s infinite}
  @keyframes bl{50%{opacity:.3}}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05080e;font-size:20px;z-index:10}

  /* ===== 武器選択画面 ===== */
  #ovbox.wide{max-width:1280px;width:96vw;max-height:96vh;overflow:auto;cursor:default;text-align:left;padding:10px 14px}
  .sel{display:flex;gap:18px;align-items:flex-start}
  .selL{flex:1;min-width:0}
  .selR{width:300px;flex-shrink:0;position:sticky;top:0;background:rgba(12,16,24,.94);border:1px solid #2b3447;border-radius:14px;padding:14px}
  .sec{font-size:20px;font-weight:900;margin:14px 0 18px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
  .sec small{font-size:12px;opacity:.6;font-weight:600;letter-spacing:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:26px 14px;padding:4px 10px 6px}
  .card{position:relative;aspect-ratio:1/1;border-radius:14px;cursor:pointer;border:3px solid rgba(255,255,255,.15);transition:transform .1s;box-shadow:0 4px 10px rgba(0,0,0,.5)}
  .card:hover{transform:scale(1.06);z-index:2}
  .card.on{border-color:#fff;box-shadow:0 0 0 3px #fff6,0 0 22px #fff8}
  .card img{position:absolute;left:-16%;top:-22%;width:132%;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.6))}
  .card .dice{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px}
  .cname{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 0 3px #000,0 2px 3px #000,0 0 6px #000;line-height:1.1;padding:0 2px}
  .r-common{background:linear-gradient(180deg,#5a606c 0%,#2a2e36 55%,#0e1014 100%)}
  .r-gold{background:radial-gradient(circle at 22% 28%,#fff 0 2px,transparent 3px),radial-gradient(circle at 78% 18%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 62%,#fffbe0 0 2px,transparent 3px),linear-gradient(180deg,#ffe24a 0%,#e0a800 55%,#6e5200 100%)}
  .r-purple{background:radial-gradient(circle at 25% 22%,#e8dcff 0 2px,transparent 3px),radial-gradient(circle at 80% 70%,#e8dcff 0 2px,transparent 3px),linear-gradient(180deg,#8f6bff 0%,#5434d6 50%,#1d1158 100%)}
  .rl-common{color:#c2c8d4}.rl-gold{color:#ffd23f}.rl-purple{color:#b49bff}
  .detail{text-align:center}
  .detail .big{position:relative;width:150px;height:150px;margin:6px auto 10px}
  .detail .big img{position:absolute;left:-12%;top:-12%;width:124%}
  .dname{font-size:22px;font-weight:900}
  .drar{font-size:12px;font-weight:800;letter-spacing:2px}
  .ddesc{font-size:13px;opacity:.85;margin:8px 0;line-height:1.5}
  .st{display:flex;align-items:center;gap:6px;font-size:12px;margin:4px 0}
  .st span{width:40px;text-align:left}
  .sb{flex:1;height:7px;background:#0b0e14;border-radius:4px;overflow:hidden}
  .sb i{display:block;height:100%;background:#ffd166}
  .lo{display:flex;gap:8px;justify-content:center;margin:12px 0 6px}
  .lo .card{width:76px;cursor:default}
  .lo .card:hover{transform:none}
  .lo .cname{font-size:10px}
  .rmode{font-size:13px;margin:10px 0 4px;text-align:center}
  .rmode button,#startBtn{font:inherit;color:#eee;background:#1d2433;border:2px solid #3a4560;border-radius:8px;padding:5px 10px;margin:3px;cursor:pointer}
  .rmode button.on{border-color:#ff4d6d;color:#fff;background:#3a1a24}
  #startBtn{display:block;width:100%;margin:12px 0 0;font-size:20px;font-weight:900;padding:10px;background:#ff4d6d;border-color:#ff4d6d;color:#fff}
  #startBtn:hover{filter:brightness(1.12)}
  .hint{font-size:11px;opacity:.6;margin-top:6px;text-align:center}
  .stcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:4px 10px 6px}
  .scard{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;cursor:pointer;border:3px solid rgba(255,255,255,.15);background:#1a1f2b;box-shadow:0 4px 10px rgba(0,0,0,.5);transition:transform .1s}
  .scard:hover{transform:scale(1.04)}
  .scard.on{border-color:#ffd166;box-shadow:0 0 0 3px #ffd16666,0 0 22px #ffd16688}
  .scard img{width:100%;height:100%;object-fit:cover;display:block}
  .scard .dice{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px}
  .scard .sname{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-weight:900;font-size:15px;text-align:center}
  .detail .smap{width:100%;border-radius:10px;border:2px solid #3a4560;margin:6px 0 8px;display:block}
  .lostage{text-align:center;font-size:13px;font-weight:800;color:#ffd166;margin:4px 0 2px}
  /* ===== ステージ選択画面 ===== */
  #ovbox.stage{max-width:1100px;width:94vw;max-height:94vh;overflow:auto;cursor:default;padding:8px 14px}
  .stHead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 4px 14px}
  .stHead h2{margin:0;font-size:30px;font-weight:900;letter-spacing:3px}
  .stHead span{font-size:13px;opacity:.65}
  .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stile{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;cursor:pointer;background:#20242c;border:3px solid #39404e;box-shadow:0 6px 14px rgba(0,0,0,.55);transition:transform .12s,border-color .12s}
  .stile:hover{transform:translateY(-4px);border-color:#ffd166}
  .stile.on{border-color:#ffd166;box-shadow:0 0 0 2px #ffd16655,0 8px 20px rgba(0,0,0,.6)}
  .stile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .stile:hover img{transform:scale(1.06)}
  .stile .shuf{position:absolute;inset:0 0 22% 0;display:flex;align-items:center;justify-content:center}
  .stile .lbl{position:absolute;left:0;right:0;bottom:0;height:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,18,.82);border-top:2px solid rgba(255,209,102,.5)}
  .stile .lbl b{font-size:19px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 3px #000}
  .stile .tag{position:absolute;top:8px;left:8px;background:#ffd166;color:#111;font-size:11px;font-weight:900;padding:2px 8px;border-radius:4px;display:none}
  .stile.on .tag{display:block}
  .stile .sd{position:absolute;left:0;right:0;bottom:22%;padding:6px 10px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .15s}
  .stile:hover .sd{opacity:1}
  #stageBtn{font:inherit;font-size:12px;color:#ffd166;background:transparent;border:1px solid #ffd16688;border-radius:6px;padding:2px 8px;margin-left:6px;cursor:pointer}
  /* ===== カギ・開放 ===== */
  .keybar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:6px 10px 4px;padding:8px 14px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.35);border-radius:10px;font-weight:800;font-size:14px}
  .keybar .kc{font-size:24px;color:#ffd166}.keybar .kc small{font-size:13px;margin-left:2px}
  .keybar .dev{margin-left:auto;font-size:12px;color:#7bdff2;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .keybar .dev button{font:inherit;font-size:12px;font-weight:800;color:#7bdff2;background:#10202a;border:1px dashed #7bdff2;border-radius:6px;padding:3px 8px;cursor:pointer}
  .keybar .dev button.on{background:#7bdff2;color:#0a1218;border-style:solid}
  .keybar .kt{flex-basis:100%;font-size:11px;font-weight:600;opacity:.65;line-height:1.5}
  .card.locked{border-style:dashed;border-color:rgba(255,255,255,.25)}
  .card.locked img,.big.locked img{filter:brightness(.22) grayscale(1) drop-shadow(0 4px 4px rgba(0,0,0,.6))}
  .card.peek{border-color:#ffd166;border-style:solid}
  .lock{position:absolute;inset:0 0 18px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;pointer-events:none}
  .lock small{font-size:13px;font-weight:900;color:#ffd166;margin-top:2px;text-shadow:0 1px 3px #000}
  #unlockBtn{display:block;width:100%;margin:12px 0 4px;font:inherit;font-size:17px;font-weight:900;padding:8px;border-radius:8px;cursor:pointer;color:#111;background:#ffd166;border:2px solid #ffd166}
  #unlockBtn:hover{filter:brightness(1.1)}
  #unlockBtn.ng{background:#2a2f3a;color:#888;border-color:#3a4050;cursor:not-allowed}
  /* 開放モーション */
  .big.opening{overflow:visible;z-index:0}
  .selR:has(.big.opening){overflow:hidden}
  .big.opening .lock{z-index:3}
  .ukey{position:absolute;left:50%;top:50%;font-size:46px;z-index:4;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7));
    animation:ukIn .5s cubic-bezier(.2,.8,.3,1) forwards,ukTurn .3s ease-in .55s forwards,ukOut .25s ease-in .95s forwards}
  @keyframes ukIn{from{transform:translate(120px,110px) rotate(-60deg) scale(.6);opacity:0}to{transform:translate(-30%,-20%) rotate(-45deg) scale(1);opacity:1}}
  @keyframes ukTurn{from{transform:translate(-30%,-20%) rotate(-45deg)}to{transform:translate(-30%,-20%) rotate(45deg)}}
  @keyframes ukOut{to{transform:translate(-30%,-20%) rotate(45deg) scale(.4);opacity:0}}
  .big.opening .lock{animation:lkShake .25s linear .62s 2}
  @keyframes lkShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-6deg)}75%{transform:translateX(5px) rotate(6deg)}}
  .big.opened .lock{animation:lkFly .6s cubic-bezier(.3,.6,.4,1) forwards}
  @keyframes lkFly{0%{transform:scale(1.2)}100%{transform:translateY(-90px) rotate(-25deg) scale(.7);opacity:0}}
  .big.opened img{filter:none!important;transition:filter .5s ease-out;animation:icPop .6s cubic-bezier(.3,1.6,.5,1)}
  @keyframes icPop{0%{transform:scale(.8)}100%{transform:scale(1)}}
  .uflash{position:absolute;inset:-10px;border-radius:24px;background:#fff;z-index:5;pointer-events:none;animation:ufl .5s ease-out forwards}
  @keyframes ufl{from{opacity:.95}to{opacity:0}}
  .urays{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;z-index:-1;pointer-events:none;border-radius:50%;
    background:repeating-conic-gradient(var(--rc) 0 8deg,transparent 8deg 22deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);
    animation:urSpin 1.6s linear forwards}
  @keyframes urSpin{0%{transform:scale(.3) rotate(0);opacity:0}20%{opacity:.9}100%{transform:scale(1.05) rotate(60deg);opacity:0}}
  .uspark{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;z-index:6;pointer-events:none;background:var(--rc);box-shadow:0 0 8px var(--rc);
    animation:usp .8s cubic-bezier(.1,.7,.3,1) forwards}
  @keyframes usp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
  .utext{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);z-index:7;white-space:nowrap;font-size:30px;font-weight:900;letter-spacing:4px;color:var(--rc);
    text-shadow:0 0 12px var(--rc),0 3px 4px #000;pointer-events:none;animation:utx .9s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes utx{0%{transform:translateX(-50%) scale(2.2);opacity:0}40%{opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
  .card.justOpen{animation:cjo 1.2s ease-out}
  @keyframes cjo{0%{box-shadow:0 0 0 4px #fff,0 0 30px 10px #ffd166;transform:scale(1.12)}100%{box-shadow:0 0 0 0 transparent;transform:scale(1)}}
  .reward{font-size:30px;font-weight:900;color:#ffd166;margin:10px 0}
  .reward small{display:block;font-size:14px;color:#ddd;font-weight:600;margin-top:4px}
  /* ===== 特別ルール・アイテム・強化 ===== */
  #modtag{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#ffd166;background:rgba(0,0,0,.5);padding:2px 12px;border-radius:12px;display:none;white-space:nowrap}
  #rivalbar{top:84px}
  #toast{position:absolute;top:124px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;text-shadow:0 2px 6px #000;white-space:nowrap;opacity:0;transition:opacity .25s}
  #buffs{position:absolute;left:24px;bottom:84px;display:flex;flex-wrap:wrap;gap:5px;max-width:300px}
  #buffs span{background:rgba(0,0,0,.5);border-radius:6px;padding:2px 7px;font-size:13px;font-weight:800}
  #hpbox .bar{position:relative}
  #psh{position:absolute;left:0;top:0;height:100%;background:#7bdff2 !important;opacity:.85}
  .slot.off{opacity:.18;filter:grayscale(1)}
  #prac{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 22px;border-radius:10px;text-align:center;font-size:15px;display:none;white-space:nowrap}
  #prac .pt{font-size:18px;font-weight:900;margin-bottom:2px}
  #prac b{color:#ffd166;font-size:18px}
  #prac .pc{font-size:18px;color:#7bdff2;margin-top:2px}
  #prac .ph{font-size:12px;opacity:.7;margin-top:3px}
  #dashpips{position:absolute;left:50%;top:calc(50% + 30px);transform:translateX(-50%);display:flex;gap:5px}
  #dashpips i{display:block;width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.85);box-shadow:0 0 3px #000}
  #dashpips i.e{background:rgba(255,255,255,.15)}
  .tbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px}
  .tchar{display:inline-flex;align-items:center;gap:6px;padding-left:8px}
  .tchar img{height:42px;margin:-6px 0}
  .tback{font:inherit;font-size:13px;font-weight:800;color:#eee;background:#1d2433;border:2px solid #3a4560;border-radius:8px;padding:4px 10px;cursor:pointer}
  .tback:hover{border-color:#ffd166;color:#ffd166}
  .stHead{gap:14px}
  .mychar{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0 0}
  .mychar img{height:96px}
  .mychar b{display:block;font-size:16px;margin-bottom:4px}
  .mychar button{font:inherit;font-size:12px;font-weight:800;color:#eee;background:#1d2433;border:2px solid #3a4560;border-radius:8px;padding:4px 10px;cursor:pointer}
  .chara{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  .chara .cv{position:sticky;top:0;text-align:center}
  .charaCanvas{width:340px;height:440px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#2b3550,#0c1018 75%);cursor:grab;display:block}
  .cpanel{width:440px;max-width:100%}
  .cpanel h2{margin:0 0 10px;font-size:28px}
  .csec{font-size:14px;font-weight:900;margin:12px 0 6px;color:#ffd166}
  .copts{display:flex;flex-wrap:wrap;gap:6px}
  .copts button{font:inherit;font-size:14px;font-weight:800;color:#ddd;background:#1d2433;border:2px solid #3a4560;border-radius:8px;padding:5px 12px;cursor:pointer}
  .copts button.on{border-color:#ffd166;color:#fff;background:#3a3020}
  .cpal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .cpal i{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid rgba(255,255,255,.2);box-shadow:0 2px 4px #0008}
  .cpal i.on{border-color:#fff;transform:scale(1.15)}
  .cpal input[type=color]{width:34px;height:30px;border:none;background:none;cursor:pointer;padding:0}
  .crow{display:flex;gap:4px;justify-content:center}
  .onl{max-width:460px;margin:16px auto 0;text-align:left}
  .orow{display:flex;align-items:center;gap:10px;margin:8px 0}
  .orow span{width:110px;font-weight:800;font-size:14px}
  .orow input{flex:1;font:inherit;font-size:17px;padding:7px 10px;border-radius:8px;border:2px solid #3a4560;background:#0e131c;color:#fff}
  .obtn{display:block;width:100%;font:inherit;font-size:19px;font-weight:900;padding:10px;border-radius:8px;cursor:pointer;color:#fff;background:#0a7ea4;border:2px solid #7bdff2;margin-top:10px}
  .obtn.sm{width:auto;margin:0;font-size:15px;padding:7px 14px}
  #netSt{margin-top:14px;min-height:40px;text-align:center;font-size:15px;line-height:1.7}
  #netSt.err{color:#ff6b81}
  #netSt .code{font-size:40px;letter-spacing:8px;color:#ffd166;user-select:text}
  .netlobby{margin:12px 0 0;padding:8px;border:1px solid #7bdff288;border-radius:8px;background:#0a1a24;font-size:13px;text-align:center}
  .spin{width:46px;height:46px;margin:20px auto;border:5px solid #7bdff244;border-top-color:#7bdff2;border-radius:50%;animation:spn 1s linear infinite}
  @keyframes spn{to{transform:rotate(360deg)}}

  if(SHOT_BUF[wp.name]) return SHOT_BUF[wp.name];
  const cal=CALIBER[wp.name]??0.5, sg=wp.pellets>1, sr=actx.sampleRate, len=0.3+cal*0.55, n=sr*len|0;
  const A=new Float32Array(n), R=new Float32Array(n);
  let l1=0,l2=0,ph=0,y1=0,y2=0,mr=1e-6;
  const tB=0.010+cal*0.045+(sg?0.015:0), tT=0.07+cal*0.22, tH=0.035+cal*0.08;
  const rf=(700+(1-cal)*1500)/sr*2*Math.PI, rr=0.992;
  for(let i=0;i<n;i++){ const t=i/sr, r=Math.random()*2-1;
    let s=0;
    if(t<0.0014){ const k=1-t/0.0014; s+=(t<0.0006?1:-0.8)*k*0.9+r*0.7*k; }                 // ①衝撃波「パンッ」
    const k=Math.min(0.9,(0.5-cal*0.22)*Math.exp(-t*(16-cal*9))+0.025); l1+=(r-l1)*k; l2+=(l1-l2)*k;
    const att=1-Math.exp(-t/0.0004);
    s+=l2*3.0*Math.exp(-t/tB)*att;                                                          // ②発射ガスの爆風
    s+=l2*1.1*Math.exp(-t/tT);                                                              //   ゴォッと尾を引く
    ph+=2*Math.PI*(32+(140-cal*70)*Math.exp(-t*28))/sr; s+=Math.sin(ph)*Math.exp(-t/tH)*(0.55+cal*0.75)*att; // ③胸に来る低音
    A[i]=s;
    const y=r*Math.exp(-t/0.012)+2*rr*Math.cos(rf)*y1-rr*rr*y2; y2=y1; y1=y; R[i]=y; mr=Math.max(mr,Math.abs(y)); // ④銃身・機関部の金属的な響き
  }
  const b=actx.createBuffer(1,n,sr), d=b.getChannelData(0); let mx=1e-6;
  for(let i=0;i<n;i++){ d[i]=Math.tanh((A[i]+R[i]/mr*0.22)*1.7); mx=Math.max(mx,Math.abs(d[i])); }
  for(let i=0;i<n;i++) d[i]*=0.95/mx;
  return SHOT_BUF[wp.name]=b; }
function playBuf(buf,vol,rate,dest,delay=0){ if(!actx) return; const s=actx.createBufferSource(); s.buffer=buf; s.playbackRate.value=rate; const g=actx.createGain(); g.gain.value=vol; s.connect(g).connect(dest||OUT); s.start(actx.currentTime+delay); }
// pos を渡すとその位置から聞こえる（ribrの銃声など）
const sfxShot=(wp,vol,far=0,pos=null)=>{ if(!actx) return; const v=vol, p=rand(0.94,1.06), n=wp.name;

  if(n==='クロスボウ'){   // 引き金が外れる「カチッ」→ 弦がたたく「バシッ！」→ 弦が震える「ビィィン」＋矢の風切り

    noise('bandpass',1700*p,500,0.06,v*1.3,1.1,0.006,S);                            // 弦が台をたたく「バシッ」
    noise('highpass',3000,1500,0.015,v*0.7,0.8,0.006,S);
    beep(150*p,0.14,v*1.2,'sine',0.006,55,S);                                       // リムの反動「ドッ」

      o.type='sawtooth'; o.frequency.setValueAtTime(118*p,t); o.frequency.exponentialRampToValueAtTime(96*p,t+0.4);
      f.type='lowpass'; f.Q.value=3; f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(260,t+0.4);
      g.gain.setValueAtTime(v*0.32,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.45);
      o.connect(f).connect(g).connect(O||OUT); o.start(t); o.stop(t+0.5); }
    noise('bandpass',700,2800,0.22,v*0.4,1.2,0.015,O);                              // 矢が飛んでいく「ヒュッ」
    noise('bandpass',2200,1400,0.04,v*0.25,4,0.35,O); return; }                     // 機構が戻る「カタッ」
  if(n==='レールガン'){   // 電磁加速の「キュイーン…バシュッ」
    beep(300*p,0.12,v*0.25,'sawtooth',0,2400,O); noise('highpass',7000,2500,0.3,v*0.7,1,0.08,S);
    beep(2400*p,0.45,v*0.3,'sawtooth',0.08,90,O); beep(55,0.6,v*1.3,'sine',0.08,25,S); noise('lowpass',3000,100,0.5,v*0.8,0.7,0.08,S); return; }
  if(n==='バウンサー'){   // 圧縮されたエネルギー弾が飛び出す、短く鋭い「ピュッ」
    noise('highpass',7000,3500,0.012,v*0.8,0.7,0,S);                 // 鋭い立ち上がり

    beep(2200*p,0.04,v*0.18,'sine',0,600,S);

    noise('lowpass',900,200,0.12,v*0.15,0.7,0.02,S); return; }        // ごく短い余韻
  if(n==='グレネードランチャー'){   // 太い筒から榴弾を撃ち出す重い「ドンッ」＋筒が響く「ボゥン」
    beep(95*p,0.3,v*1.6,'sine',0,32,S);                              // 腹に響く低音
    noise('lowpass',1600*p,120,0.28,v*1.4,1,0,S);                    // 発射ガスの爆風
    noise('bandpass',700*p,250,0.08,v*1.0,1.2,0,S);                  // 「ドッ」という芯
    beep(260*p,0.14,v*0.45,'triangle',0.004,110,S);                  // 筒の中で空気が鳴る「ボゥン」
    noise('highpass',4000,2000,0.012,v*0.5,0.7,0,S);                 // 撃った瞬間の「パン」
    noise('lowpass',600,70,0.8,v*0.35,0.7,0.04,S);                   // 遠くへ抜ける余韻
    noise('bandpass',2600,1600,0.03,v*0.3,5,0.09,O); beep(420,0.03,v*0.12,'square',0.09,300,O); return; }   // 金属の機構音「ガチャ」
  if(n==='ロケットランチャー'){   // 点火の破裂音「バシュッ」＋ロケットの噴射「ゴォォォ」
    noise('highpass',3500,1500,0.03,v*0.9,0.7,0,S); noise('lowpass',2600*p,150,0.4,v*1.6,1,0,S);
    beep(70*p,0.6,v*1.5,'sine',0,28,S); beep(45,0.9,v*0.9,'sine',0.02,25,S);
    noise('bandpass',1100,350,1.3,v*0.75,0.6,0.04,S);                // 噴射の轟音
    noise('highpass',2500,1200,0.9,v*0.18,0.7,0.06,O);                // パチパチと燃える音
    noise('lowpass',500,60,1.2,v*0.35,0.7,0.1,S); return; }
  // 火薬式：合成した銃声サンプル＋距離で変わる質感＋残響（SHOTバス経由で歪み＋リバーブ）
  const cal=CALIBER[n]??0.5, near=1-far;
  // 少し高めで乾いた音に：全体のピッチを上げ、響きを短めに。ハンドガンは特に乾いた「パンッ」
  const hg=n==='ピストル'||n==='リボルバー', pr=p*(hg?1.12:1.05), tm=hg?0.45:0.75;

  if(n==='リボルバー') noise('bandpass',3500,2500,0.03,v*0.2,8,0.2,O);

// 爆発音：本物は「パン」ではなく、低くて重い「ドォン…」＋地面を伝わるゴロゴロ。高い音はほとんど出ない
const BOOM_BUF=[];
function boomBuf(){
  if(BOOM_BUF.length>=3) return randOf(BOOM_BUF);
  const sr=actx.sampleRate, n=sr*5|0, b=actx.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); let l1=0,l2=0,r1=0,r2=0,ph=0,mx=1e-6;
    for(let i=0;i<n;i++){ const t=i/sr, r=Math.random()*2-1, att=1-Math.exp(-t/0.003);
      const k=0.01+0.2*Math.exp(-t/0.06);                               // こもっていく爆風（最初だけ少し明るい）
      l1+=(r-l1)*k; l2+=(l1-l2)*k;
      let s=l2*7*(Math.exp(-t/0.45)+0.45*Math.exp(-t/1.6))*att;         // 「ドォォン」と長く伸ばす
      ph+=2*Math.PI*(22+42*Math.exp(-t*3.5))/sr; s+=Math.sin(ph)*1.1*Math.exp(-t/1.1)*att;   // 腹に響く超低音（ゆっくり下がる）
      r1+=(r-r1)*0.006; r2+=(r1-r2)*0.006;                               // 地面を伝わるゴロゴロ（ゆっくり揺れる）
      s+=r2*40*Math.exp(-t/2.2)*(0.7+0.3*Math.sin(t*7+c*2))*(1-Math.exp(-t/0.1));
      if(t<0.004){ s+=l1*2.5*(1-t/0.004); }                              // 最初の「ズッ」という衝撃（高すぎない）
      d[i]=s; mx=Math.max(mx,Math.abs(s)); }
    for(let i=0;i<n;i++) d[i]=Math.tanh(d[i]/mx*1.4)*0.95; }
  BOOM_BUF.push(b); return b; }
const sfxBoom=(vol,pos=null)=>{ if(!actx) return; const O=pos?spatial(pos.x,pos.z,OUT):OUT;
  playBuf(boomBuf(),vol*2.2,rand(0.85,1.0),O);

  const len=heavy?0.34:long?0.22:0.15, f0=heavy?250:long?500:800, fp=heavy?1100:long?2600:4200, pk=len*0.38, t=actx.currentTime, p=rand(0.92,1.08);
  const layer=(type,a,b,c,q,vol)=>{ const s=actx.createBufferSource(); s.buffer=noiseBuf; const f=actx.createBiquadFilter(); f.type=type; f.Q.value=q;
    f.frequency.setValueAtTime(a*p,t); f.frequency.exponentialRampToValueAtTime(b*p,t+pk); f.frequency.exponentialRampToValueAtTime(c*p,t+len);
    const g=actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*k,t+pk); g.gain.exponentialRampToValueAtTime(0.0001,t+len);

}

  const b=(GUN_BUILD[wp.name]||GUN_BUILD['アサルトライフル'])(g,!hands,wp);
  let offHand=[];
  if(hands){ const [gu,gv,a,hd,hw,s0]=b.grip;
    gripHand(g,gu,gv,a,1,{hd,hw,s0,trig:b.trig});
    const n0=g.children.length;
    if(b.pistol) gripHand(g,gu,gv,a,-1,{hd,hw,s0:s0+0.006,fo:0.006,arm:V3(gu-0.3,gv-0.2,-0.17)});
    else if(b.vert){ const [vu,vv,va,vhd,vhw]=b.vert; gripHand(g,vu,vv,va,-1,{hd:vhd,hw:vhw,s0:0.014,arm:V3(vu-0.4,vv-0.25,-0.2)}); }
    else if(b.fore) foreHand(g,...b.fore);
    offHand=g.children.slice(n0);   // 左手（リロード中は隠してリロード用の手に差し替える）
  }
  const trigF=g.children.find(c=>c.userData.trigFinger)||null, trigM=[];
  g.traverse(c=>{ if(c.userData.trig){ c.userData.x0=c.position.x; trigM.push(c); } });
  const bow=g.userData.bowStr?{str:g.userData.bowStr,bolt:g.userData.bolt||[],released:false,relT:9}:null;
  return {group:g,tip:V3(b.tip[0],b.tip[1]),spin:b.spin||null,sight:b.sight,b,offHand,trigF,trigM,bow};
}

function blade(g,pts,th,grind,flat=W.satin,edge=W.polish,flatPlane=false){
  const geo=new THREE.ExtrudeGeometry(shapeOf(pts),{depth:0.0004,bevelEnabled:true,bevelThickness:th/2,bevelSize:grind,bevelOffset:-grind,bevelSegments:1,curveSegments:14});
  geo.translate(0,0,-0.0002); if(!flatPlane) geo.rotateY(Math.PI/2); uvScale(geo,6);
  return mesh(g,geo,[flat,edge]);
}

function trackHabits(dt){
  const p=player, r=rival; if(p.hp<=0||r.hp<=0) return;
  habit.t+=dt;
  if(r.seenT>0){ const d=dist(p,r); if(d<7) habit.near+=dt; else if(d>16) habit.far+=dt; }
  else if(r.unseenT>2) habit.hide+=dt;
  if(p.x<AW*0.7&&p.x>AW*0.2) habit[p.z>AD/2?'right':'left']+=dt;   // スタート地点から見て右(+z)か左か

function readHabits(){
  const h=habit, T=Math.max(1,h.t), out=[];
  if(h.t<25) return out;
  const nf=h.near+h.far+1;
  if(h.near/nf>0.6&&h.near>8) out.push(['near',h.near/nf]);
  if(h.far/nf>0.6&&h.far>8) out.push(['far',h.far/nf]);
  const lr=h.left+h.right+1;
  if(h.right/lr>0.64) out.push(['right',h.right/lr]); else if(h.left/lr>0.64) out.push(['left',h.left/lr]);
  if(h.hide/T>0.35) out.push(['hide',h.hide/T+0.1]);
  if(h.melee/T>0.3) out.push(['melee',h.melee/T+0.2]);
  if(h.air/T>0.12) out.push(['air',h.air/T*3]);
  return out.sort((a,b)=>b[1]-a[1]);
}

function setNetStatus(html,cls=''){ const el=document.getElementById('netSt'); if(el){ el.innerHTML=html; el.className=cls; } }
function netConnect(url,first){
  netClose();
  if(!url){ setNetStatus('サーバーのURLを入力してください','err'); return; }
  net={ws:null,role:first.t==='create'?'host':'guest',code:null,peer:false,match:false,oppName:'',meLo:null,oppLo:null,
    ready:{me:false,opp:false},perks:{me:false,opp:false},dead:{host:null,guest:null},deadT:null,sentDead:false,sendT:0,tgt:null};
  setNetStatus('サーバーに接続中…<br><small>（無料サーバーは、しばらく使っていないと起動に1分ほどかかります）</small>');
  let ws; try{ ws=new WebSocket(url); }catch(e){ net=null; setNetStatus('サーバーのURLが正しくありません','err'); return; }
  net.ws=ws;
  ws.onopen=()=>netRaw({...first,name:myName});
  ws.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } try{ onNet(m); }catch(e){ console.error(e); } };
  ws.onclose=()=>{ if(!net||net.ws!==ws) return; const was=net.peer; net=null; if(was) netLost('通信が切れました'); else setNetStatus('サーバーとの接続が切れました','err'); };
  ws.onerror=()=>{ if(net&&net.ws===ws&&!net.peer) setNetStatus('サーバーにつながりませんでした。URLやネット接続を確かめてください','err'); };
}
function netClose(){ const n=net; net=null; if(n&&n.ws){ try{ n.ws.close(); }catch(e){} } }
function netLost(msg){ netClose(); goTitle(); toast(`🌐 ${msg}`); }
setInterval(()=>{ if(net&&net.ws&&!isOnline()) netRaw({t:'ping'}); },20000);   // 待っている間も接続を保つ

function onNet(m){
  if(!net) return;
  switch(m.t){
    case 'created': net.code=m.code; setNetStatus(`部屋コード <b class="code">${m.code}</b><br>このコードを友達に教えてね。相手が入るのを待っています…`); break;
    case 'joined': case 'peer':
      net.peer=true; net.oppName=m.opp||'相手'; if(m.code) net.code=m.code;
      beep(660,0.12,0.12,'triangle'); beep(990,0.2,0.12,'triangle',0.12);
      if(net.role==='host'){ state='stage'; showOverlay('stage'); } else { state='select'; showOverlay('select'); }
      toast(`🌐 <b>${net.oppName}</b> と接続しました！装備を選んで「準備OK」を押してね`); break;
    case 'err': setNetStatus(m.m,'err'); { const w=net.ws; net=null; try{ w.close(); }catch(e){} } break;
    case 'left': case 'bye': netLost(`${net.oppName||'相手'} が退出しました`); break;
    case 'ready': net.ready.opp=true; net.oppLo=m.lo; net.oppLook=sanitizeLook(m.look); if(state==='select'){ const st=ovbox.scrollTop; renderSelect(); ovbox.scrollTop=st; } netMaybeStart(); break;
    case 'unready': net.ready.opp=false; break;
    case 'start': if(net.role==='guest') startOnlineMatch(m); break;
    case 's': net.tgt=m;
      if(rival&&rival.hp>0&&state!=='roundEnd'){ rival.hp=m.hp; }
      if(rival){ rival.maxHp=m.mh; rival.shield=m.sh; rival.crouch=m.cr; rival.height=1.88-0.85*m.cr; rival.boostT=m.bt?1:0; rival.infT=m.it?1:0;
        if(rival.slot!==m.sl){ rival.slot=m.sl; } }
      break;
    case 'f': if(isOnline()&&rival&&(state==='fight'||state==='roundEnd')) netShot(m); break;
    case 'w': if(isOnline()&&rival&&state==='fight'){ const md=rival.melee; rival.slot=1; rival.swingDur=Math.min(0.34,md.rate*0.92); rival.swingT=rival.swingDur; rival.swingDir=m.dir||1;
      sfxSwish(rival,md); const heavy=md.model==='axe'||md.model==='hammer'||md.model==='scythe'; rival.pendHit=rival.swingDur*(heavy?0.3:0.2); } break;
    case 'u': if(isOnline()&&rival&&state==='fight'){
      if(m.k==='medkit') rival.healT=0.9;
      else if(m.k==='pad') addZone({type:'pad',x:m.x,z:m.z,r:0.75,t:Infinity,owner:rival});
      else spawnThrow(rival,UTILS.find(u=>u.kind===m.k)||rival.util,...m.o,...m.v); } break;
    case 'h': if(isOnline()){ hitmarkT=0.18; $('hitmark').style.color=m.hd?'#ff3355':'#fff'; beep(m.hd?1500:1100,0.05,0.12,'triangle'); sfxHit(!!m.hd); dmgNumber(m.a,!!m.hd,rival);
      if(player.lifesteal&&player.hp>0) player.hp=Math.min(player.maxHp,player.hp+m.a*player.lifesteal); } break;
    case 'dead': if(net.role==='host'&&isOnline()){ net.dead.guest={head:!!m.hd}; if(net.deadT==null) net.deadT=0.25; } break;
    case 'rend': if(net.role==='guest'&&isOnline()) netRoundEnd(m.hd,m.gd,m.hh,m.gh); break;
    case 'perk': { const pk=PERKS.find(p=>p.id===m.id); if(pk){ matchPerks.r.push(pk); rivalNewPerk=pk; } net.perks.opp=true; netMaybeNextRound(); break; }
    case 'rstart': if(net.role==='guest'){ netStartRound(m.r,m.mod); netResume(); } break;
    case 'pks': { const pk=pickups[m.i]; if(pk&&!pk.kind) spawnPickup(pk,m.k); break; }
    case 'take': { const pk=pickups[m.i]; if(pk&&pk.kind) takePickup(pk,rival); break; }
  }
}

// 相手の位置をなめらかに追いかける
function updateNetRival(dt){
  const r=rival, s=net.tgt; if(!s) return;
  const k=1-Math.exp(-dt*14), ox=r.x, oz=r.z;
  if(Math.hypot(s.x-r.x,s.z-r.z)>5){ r.x=s.x; r.z=s.z; r.y=s.y; }
  else { r.x+=(s.x-r.x)*k; r.z+=(s.z-r.z)*k; r.y+=(s.y-r.y)*k; }
  r.angle+=angDiff(r.angle,s.a)*k;
  r.onGround=Math.abs(r.y-groundAt(r.x,r.z,r.r,r.y+0.05))<0.08;
  const ow=r.walk; r.walk+=Math.hypot(r.x-ox,r.z-oz)*3.2;
  if(r.onGround&&Math.floor(ow/Math.PI)!==Math.floor(r.walk/Math.PI)){ const v=0.26*clamp(1-dist(r,player)/30,0,1); if(v>0.01) sfxStep(r,v,r.y>0.5); }
}

function netTick(dt){

  if(net.sendT<=0){ net.sendT=0.05; const p=player, f=n=>+n.toFixed(3);
    netRaw({t:'s',x:f(p.x),y:f(p.y),z:f(p.z),a:f(facing(p)),sl:p.slot,cr:+p.crouch.toFixed(2),hp:+p.hp.toFixed(1),mh:p.maxHp,sh:Math.round(p.shield),bt:p.boostT>0?1:0,it:p.infT>0?1:0}); }
  // 自分がやられたら知らせる（勝敗はホストが決める）
  if(player.hp<=0&&!net.sentDead){ net.sentDead=true;
    if(net.role==='host'){ net.dead.host={head:!!player.killedByHead}; if(net.deadT==null) net.deadT=0.25; }
    else netSend({t:'dead',hd:player.killedByHead?1:0}); }

    if(net.deadT<=0){ net.deadT=null; const hd=!!net.dead.host, gd=!!net.dead.guest, hh=!!net.dead.host?.head, gh=!!net.dead.guest?.head;
      netSend({t:'rend',hd,gd,hh,gh}); netRoundEnd(hd,gd,hh,gh); } }

function netRoundEnd(hd,gd,hh,gh){

  else if(rival.hp<=0) rival.hp=1;
  if(oppDied&&!meDied) score.p++; else if(meDied&&!oppDied) score.r++;
  finishRound(oppDied&&!meDied,oppDied&&meDied,null);
}

function sanitizeLook(o){ const L={...LOOK_DEF}; if(!o||typeof o!=='object') return L;

// ================= 射撃練習モード =================
// 的（人型ターゲット）が次々に出る。T：60秒チャレンジ／G：銃を持ち替え（未開放の銃もお試しできる）
let practice=false, targets=[], pracGun=0;
const prac={shots:0,hits:0,heads:0,kills:0,dmg:0,chal:false,t:0,score:0};
let pracBest={}; try{ pracBest=JSON.parse(localStorage.getItem('rivalArenaPractice')||'{}')||{}; }catch(e){}
const hitList=()=>practice?[player,...targets.filter(t=>t.alive)]:[player,rival];
const TGT_TEX=tex(makeCanvas(256,(g,s)=>{ g.fillStyle='#f2eee4'; g.fillRect(0,0,s,s);
  for(let i=5;i>0;i--){ g.fillStyle=i%2?'#d7263d':'#f2eee4'; g.beginPath(); g.arc(s/2,s*0.42,i*s*0.08,0,7); g.fill(); }
  g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2; g.strokeRect(4,4,s-8,s-8); speckle(g,s,3000,['rgba(0,0,0,0.08)'],1.5); }));
const TGT_MAT={face:new THREE.MeshStandardMaterial({map:TGT_TEX,roughness:0.9}),wood:new THREE.MeshStandardMaterial({color:0x8a6a44,roughness:0.85}),
  head:new THREE.MeshStandardMaterial({color:0xff8c42,roughness:0.6}),metal:new THREE.MeshStandardMaterial({color:0x50555c,metalness:0.8,roughness:0.4})};
function makeTargetMesh(){
  const g=new THREE.Group(), piv=new THREE.Group(); g.add(piv);
  const add=(geo,mat,x,y,z)=>{ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; piv.add(m); return m; };
  add(new THREE.CylinderGeometry(0.35,0.4,0.06,20),TGT_MAT.metal,0,0.03,0);
  add(new THREE.BoxGeometry(0.06,0.55,0.06),TGT_MAT.wood,0,0.3,0);
  add(new THREE.BoxGeometry(0.58,0.95,0.05),TGT_MAT.face,0,1.02,0);
  add(new THREE.BoxGeometry(0.14,0.12,0.05),TGT_MAT.wood,0,1.54,0);
  add(new THREE.SphereGeometry(0.17,20,14),TGT_MAT.head,0,1.67,0);
  g.userData.piv=piv; return g; }
function targetSpot(){
  for(let k=0;k<80;k++){ const i=Math.random()*grid.length|0; if(!grid[i]) continue;
    const x=(i%GW)*CS+CS/2, z=((i/GW)|0)*CS+CS/2, d=Math.hypot(x-player.x,z-player.z);
    if(d<7||d>32||targets.some(t=>t.alive&&Math.hypot(t.x-x,t.z-z)<3)) continue;
    if(k<60&&!los(player,{x,z})) continue;
    return {x,z}; }
  return freeSpot(rand(8,AW-8),rand(4,AD-4)); }
function spawnTarget(){
  const p=targetSpot(), mesh=makeTargetMesh();
  const t={x:p.x,z:p.z,y:0,r:0.32,height:1.84,hp:100,maxHp:100,armor:1,shield:0,lastHitT:9,hitT:0,isTarget:true,alive:true,downT:0,mesh,bx:p.x,bz:p.z,
    mv:Math.random()<(prac.chal?0.5:0.35)?{ax:Math.random()<0.5,amp:rand(1.5,3),spd:rand(0.8,1.6),ph:Math.random()*6}:null,up:0};
  mesh.position.set(t.x,0,t.z); mesh.rotation.y=Math.atan2(player.x-t.x,player.z-t.z); mesh.scale.setScalar(0.01); scene.add(mesh); targets.push(t);
  const D=spatial(t.x,t.z,OUT); noise('bandpass',900,500,0.12,0.15,2,0,D); beep(220,0.08,0.1,'square',0.05,140,D);
}
function targetDown(t,head){
  t.alive=false; t.downT=0; prac.kills++;
  if(prac.chal) prac.score+=100+(head?50:0);
  beep(head?1760:1320,0.15,0.1,'triangle'); noise('lowpass',1400,200,0.25,0.25,1,0.05);
}
function sfxTargetHit(t,head){ const D=spatial(t.x,t.z,OUT); noise('bandpass',head?1200:2200,700,0.05,0.25,2,0,D); beep(head?300:520,0.05,0.12,'square',0,undefined,D); }
function nearestTarget(e){ let best=null,bd=9; const f=facing(e);
  for(const t of targets){ if(!t.alive) continue; const d=dist(e,t); if(d<bd&&Math.abs(angDiff(f,Math.atan2(t.z-e.z,t.x-e.x)))<1){ bd=d; best=t; } } return best; }
function updateTargets(dt){
  for(const t of targets){
    if(t.alive){ t.up=Math.min(1,t.up+dt*4); t.mesh.scale.setScalar(0.01+0.99*t.up*(2-t.up));
      if(t.mv){ t.mv.ph+=dt*t.mv.spd; const o=Math.sin(t.mv.ph)*t.mv.amp, nx=t.mv.ax?t.bx+o:t.bx, nz=t.mv.ax?t.bz:t.bz+o;
        if(!blocked(nx,nz,t.r)){ t.x=nx; t.z=nz; } t.mesh.position.set(t.x,0,t.z); }
      t.mesh.rotation.y=Math.atan2(player.x-t.x,player.z-t.z); }
    else { t.downT+=dt; t.mesh.userData.piv.rotation.x=-(Math.min(1,t.downT/0.35)**2)*Math.PI/2; if(t.downT>1.1){ scene.remove(t.mesh); t.dead=true; } }
  }
  targets=targets.filter(t=>!t.dead);
  while(targets.filter(t=>t.alive).length<4) spawnTarget();
  if(prac.chal){ prac.t-=dt; if(prac.t<=0) endChallenge(); }
}
function resetPracStats(){ Object.assign(prac,{shots:0,hits:0,heads:0,kills:0,dmg:0,score:0}); }
function startChallenge(){
  resetPracStats(); prac.chal=true; prac.t=60;
  for(const t of targets) scene.remove(t.mesh); targets=[];
  player.ammo=player.weap.mag; player.reloadT=0;

function setPracticeGun(i){

function startPractice(){

  loadStage(sel.stage===-1?0:sel.stage);
  score={p:0,r:0}; round=1; curMod=null; matchPerks={p:[],r:[]}; GRAV=14; const th=currentTheme(); scene.fog.near=th.fogN; scene.fog.far=th.fogF;

// ================= 行動 =================
function switchSlot(e,s){
  if(e.slot===s||e.healT>0||(s===0&&e.noGun)) return;
  e.prevSlot=e.slot; e.slot=s; e.switchT=0.22; e.burstLeft=0;
  if(e===player){ beep(500,0.04,0.06,'square'); }
}
function startReload(e){ if(e.reloadT>0||e.ammo===e.weap.mag) return; e.reloadT=e.weap.reload;
  if(e===player&&vm) reloadAnim={plan:reloadPlan(e.weap,vm.b,e.weap.mag-e.ammo),last:0};
  else if(e!==player){ const d=dist(e,player), v=clamp(1-d/25,0,1)*0.5; if(v>0.02){ noise('bandpass',1900,1200,0.04,0.2*v,4,e.weap.reload*0.5); noise('bandpass',2600,1500,0.06,0.25*v,5,e.weap.reload*0.75); } } }
const _v=new THREE.Vector3(), _r=new THREE.Vector3(), _u=new THREE.Vector3();
function spawnBullet(owner,ox,oy,oz,dx,dy,dz,wp){
  const mesh=new THREE.Mesh(tracerGeo,tracerMat(wp.color)); mesh.visible=false; scene.add(mesh);
  bullets.push({x:ox,y:oy,z:oz,vx:dx*wp.speed,vy:dy*wp.speed,vz:dz*wp.speed,speed:wp.speed,life:wp.life,owner,dmg:wp.dmg,bounces:wp.bounces,bounced:false,mesh,
    grav:wp.grav||0,explode:wp.explode||null,pierce:!!wp.pierce,thick:wp.thick||1,smoke:!!wp.smoke,tl:Math.min(2.5,wp.speed*0.012+0.3),trav:0});
}
function fire(e){
  const wp=e.weap;
  if(e.reloadT>0||e.cool>0||e.burstLeft>0) return;
  if(e.ammo<=0){ if(e===player) sfxTrigger(true); startReload(e); return; }
  e.cool=wp.rate*(e.infT>0?0.7:1);
  if(wp.burst){ e.burstLeft=wp.burst-1; e.burstT=0.07; }
  shootOnce(e);
}
function shootOnce(e){
  const wp=e.weap; if(!(e.infAmmo||e.infT>0)) e.ammo--;
  if(practice&&e===player) prac.shots+=wp.pellets;
  if(e===player){
    camera.getWorldDirection(_v); _r.set(1,0,0).applyQuaternion(camera.quaternion); _u.set(0,1,0).applyQuaternion(camera.quaternion);
    const ads=adsAmt>0.6; let sp=wp.spread*(ads?0.5:1); if(wp.name==='スナイパー'&&!ads) sp+=0.05;
    const dirs=[];
    for(let i=0;i<wp.pellets;i++){
      const d=_v.clone().addScaledVector(_r,rand(-sp,sp)).addScaledVector(_u,rand(-sp,sp)).normalize();
      spawnBullet(e,camera.position.x,camera.position.y-0.03,camera.position.z,d.x,d.y,d.z,wp); dirs.push([+d.x.toFixed(4),+d.y.toFixed(4),+d.z.toFixed(4)]);}
    netSend({t:'f',o:[+camera.position.x.toFixed(3),+(camera.position.y-0.03).toFixed(3),+camera.position.z.toFixed(3)],d:dirs});
    kick=Math.min(0.15,kick+wp.kick); pitch=clamp(pitch+wp.kick*0.35,-1.5,1.5); yaw+=rand(-1,1)*wp.kick*0.1;
    flashT=NO_SPARK.has(wp.name)?0:0.05; sfxShot(wp,0.35); ejectCasing(wp);   // クロスボウは火が出ない

const facing=e=>e===player?Math.atan2(-Math.cos(yaw),-Math.sin(yaw)):e.angle;

function meleeHit(e){

  const d=dist(e,t), a=Math.atan2(t.z-e.z,t.x-e.x);

function addZone(z){
  if(z.type==='fire'){ const m=new THREE.Mesh(new THREE.CircleGeometry(z.r,32),new THREE.MeshBasicMaterial({map:flashTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));
    m.rotation.x=-Math.PI/2; m.position.set(z.x,0.04,z.z); z.mesh=m; }
  if(z.type==='smoke'){ const g=new THREE.Group(); z.mat=new THREE.SpriteMaterial({map:smokeTex,color:0xa8a8a8,transparent:true,depthWrite:false,opacity:0});
    for(let i=0;i<34;i++){const s=new THREE.Sprite(z.mat);const a=Math.random()*6.28,r=Math.sqrt(Math.random())*z.r*0.85;s.position.set(Math.cos(a)*r,rand(0.4,2.8),Math.sin(a)*r);s.scale.setScalar(rand(2.6,4.2));g.add(s);}
    g.position.set(z.x,0,z.z); z.mesh=g; z.alpha=0; z.age=0; }
  if(z.type==='pad'){ const m=makeUtilModel(UTILS.find(u=>u.kind==='pad')); m.scale.setScalar(2.6); m.position.set(z.x,0.02,z.z); m.traverse(c=>c.receiveShadow=true); z.mesh=m; z.cd=0; }
  scene.add(z.mesh); zones.push(z);
}
function updateZones(dt){
  let fireI=0;
  for(const z of zones){
    z.t-=dt;
    if(z.type==='fire'){
      z.mesh.material.opacity=Math.min(1,z.t)*(0.7+Math.random()*0.3);
      for(let i=0;i<4;i++){const a=Math.random()*6.28,r=Math.sqrt(Math.random())*z.r;emit(z.x+Math.cos(a)*r,0.1,z.z+Math.sin(a)*r,Math.random()<0.5?0xff8a20:0xffd040,1,1.5,-2);}
      fireLight.position.set(z.x,1,z.z); fireI=Math.max(fireI,6*Math.min(1,z.t)*(0.8+Math.random()*0.4));
      for(const e of hitList()) if(e.hp>0&&Math.hypot(e.x-z.x,e.z-z.z)<z.r+e.r*0.5&&e.y<0.6){ damage(e,24*dt,false,true); if(e===player) hurt=Math.max(hurt,0.35); }
    }
    if(z.type==='smoke'){ z.age+=dt; z.alpha=Math.min(1,z.age/0.8,z.t/1.5); z.mat.opacity=0.92*z.alpha; z.mesh.rotation.y+=dt*0.05; }
    if(z.type==='pad'){ z.cd-=dt;
      for(const e of [player,rival]) if(e.hp>0&&Math.hypot(e.x-z.x,e.z-z.z)<z.r&&e.y<0.15){ e.vy=12; e.slideT=0; beep(400,0.25,0.12,'sine',0,1200); emit(z.x,0.1,z.z,0x00e5ff,20,3); } }
  }
  fireLight.intensity=fireI;
  zones=zones.filter(z=>{ if(z.t<=0){scene.remove(z.mesh);return false;} return true; });
}

// ================= 投げ物 =================
function updateThrows(dt){
  for(const t of throws){
    if(!t.stuck){
      t.vy-=GRAV*dt;
      let nx=t.x+t.vx*dt, ny=t.y+t.vy*dt, nz=t.z+t.vz*dt;
      let landed=false;
      if(ny<0.06){ ny=0.06; landed=true;
        if(t.vy<-2&&t.kind!=='molotov'){ const D=spatial(nx,nz,OUT), v=clamp(-t.vy/12,0.1,0.5)*clamp(1-dist({x:nx,z:nz},player)/25,0,1);   // 重い金属の塊が転がる「ゴッ、ゴロッ」
          if(v>0.01){ noise('lowpass',900,150,0.07,v,1,0,D); beep(rand(150,200),0.06,v*0.6,'sine',0,90,D); noise('bandpass',1400,900,0.03,v*0.3,2,0.005,D); } }
        if(t.kind==='molotov'){ ignite(nx,nz); t.dead=true; continue; }
        t.vy=-t.vy*0.35; t.vx*=0.6; t.vz*=0.6; if(Math.abs(t.vy)<1.2){ t.vy=0; if(t.kind==='mine'){t.stuck=true;t.armT=0.9;t.vx=t.vz=0;} } }
      const hit=solidAt(nx,ny,nz);
      if(hit){ if(t.kind==='molotov'){ ignite(t.x,t.z); t.dead=true; continue; }
        const {n}=surface(hit,t,nx,ny,nz); if(n.x)t.vx*=-0.45; if(n.z)t.vz*=-0.45; if(n.y){t.vy=Math.abs(t.vy)*0.35;} nx=t.x; nz=t.z; if(n.y) ny=t.y; }
      if(t.kind==='molotov'){ const tg=t.owner===player?rival:player; if(Math.hypot(tg.x-nx,tg.z-nz)<tg.r+0.1&&ny>tg.y&&ny<tg.y+tg.height){ ignite(nx,nz); t.dead=true; continue; } }
      t.x=nx; t.y=ny; t.z=nz;
      if(!landed||t.vy!==0){ t.mesh.rotation.x+=t.spin*dt; t.mesh.rotation.z+=t.spin*0.6*dt; }
      if(t.kind==='mine'&&t.stuck){ t.mesh.rotation.set(0,0,0); t.y=0.03; }
      t.mesh.position.set(t.x,t.y,t.z);
      if(t.kind==='molotov'&&Math.random()<0.6) emit(t.x,t.y+0.1,t.z,0xff9a30,1,0.5,-1);
    }
    t.fuse-=dt;
    if(t.kind==='grenade'&&t.fuse<=0){ explode(t.x,t.y+0.2,t.z,{explode:{r:4,dmg:90},owner:t.owner}); t.dead=true; }
    if(t.kind==='flash'&&t.fuse<=0){ doFlash(t.x,t.y+0.2,t.z); t.dead=true; }
    if(t.kind==='smoke'&&t.fuse<=0){ addZone({type:'smoke',x:clamp(t.x,1,AW-1),z:clamp(t.z,1,AD-1),r:4,t:9}); noise('highpass',3000,1500,1.2,0.12); t.dead=true; }
    if(t.kind==='mine'&&t.stuck){ t.armT-=dt;
      if(t.mesh.userData.led) t.mesh.userData.led.visible=t.armT<=0&&Math.floor(performance.now()/300)%2===0;
      const tg=t.owner===player?rival:player;
      if(t.armT<=0&&tg.hp>0&&Math.hypot(tg.x-t.x,tg.z-t.z)<1.7&&tg.y<0.6){ beep(1400,0.08,0.15,'square'); explode(t.x,0.3,t.z,{explode:{r:3.2,dmg:85},owner:t.owner}); t.dead=true; } }
  }
  throws=throws.filter(t=>{ if(t.dead){scene.remove(t.mesh);return false;} return true; });
}
function ignite(x,z){ addZone({type:'fire',x:clamp(x,0.5,AW-0.5),z:clamp(z,0.5,AD-0.5),r:2.6,t:5}); noise('lowpass',3000,300,0.6,0.35); emit(x,0.3,z,0xff8a20,40,4,-1); }
function doFlash(x,y,z){
  boomSprite.material.map=whiteTex; boomSprite.position.set(x,y,z); boomLight.position.set(x,y+0.5,z); boomLight.color.set(0xffffff); boomT=0.4; boomR=5;
  noise('highpass',6000,3000,0.4,0.4); beep(3200,2.2,0.04,'sine');

    const d=Math.hypot(e.x-x,e.z-z); if(d>28||!los({x,z},e,true)) continue;
    let look;
    if(e===player){ camera.getWorldDirection(_v); const tx=x-camera.position.x,ty=y-camera.position.y,tz=z-camera.position.z,l=Math.hypot(tx,ty,tz)||1; look=(_v.x*tx+_v.y*ty+_v.z*tz)/l; }

function keyLabel(c){
  if(!c) return '―';
  const A={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Space:'Space',ShiftLeft:'左Shift',ShiftRight:'右Shift',ControlLeft:'左Ctrl',ControlRight:'右Ctrl',
    AltLeft:'左Alt',AltRight:'右Alt',Tab:'Tab',CapsLock:'CapsLock',Enter:'Enter',Backspace:'BackSpace',Backquote:'`',Minus:'-',Equal:'^',BracketLeft:'@',BracketRight:'[',

  if(A[c]) return A[c]; if(/^Key/.test(c)) return c.slice(3); if(/^Digit/.test(c)) return c.slice(5); if(/^Numpad/.test(c)) return 'テンキー'+c.slice(6); return c; }

  if(other) KB[other]=KB[a];   // 他の動作で使っていたキーは入れ替え
  KB[a]=c; saveKB(); }
// マウスの横ボタン・ホイールクリックもキーとして使える
function actDown(c,rep=false){
  if(state!=='fight') return;
  if(isAct('slot1',c)) switchSlot(player,0);
  if(isAct('slot2',c)) switchSlot(player,1);
  if(isAct('slot3',c)) switchSlot(player,2);
  if(isAct('prev',c)) switchSlot(player,player.prevSlot);
  if(isAct('reload',c)) startReload(player);
  if(rep) return;
  if(isAct('dash',c)){ const {mx,mz}=moveInput(); tryBoost(player,mx,mz); }
  if(practice&&isAct('chal',c)) startChallenge();
  if(practice&&isAct('pgun',c)) cyclePracticeGun();
  if(isAct('crouch',c)) trySlide();
  if(isAct('jump',c)) tryJump(player);
}

// ================= プレイヤー =================
function moveInput(){
  let f=0,s=0;
  if(held('fwd'))f++; if(held('back'))f--; if(held('right'))s++; if(held('left'))s--;
  const mx=-Math.sin(yaw)*f+Math.cos(yaw)*s, mz=-Math.cos(yaw)*f-Math.sin(yaw)*s;
  return {mx,mz,l:Math.hypot(mx,mz)};
}
const SLIDE_TIME=0.75, SLIDE_START=11.5, SLIDE_END=3.5;
function trySlide(){
  const p=player; if(p.slideT>0||p.slideCD>0||!p.onGround||p.hp<=0) return;
  const {mx,mz,l}=moveInput(); if(l===0) return; // 止まっている時はしゃがみ
  p.sdx=mx/l; p.sdz=mz/l; p.slideT=SLIDE_TIME; p.slideCD=1.0;

}
const slotMul=e=>e.slot===0?(e.weap.moveMul||1):e.slot===1?(e.melee.moveMul||1):1;
function updatePlayer(dt){
  const p=player, {mx,mz,l}=moveInput();
  const ducking=held('crouch')&&p.slideT<=0&&p.hp>0;
  const sp=(ducking?2.8:held('run')&&!rightDown?7.5:5.5)*(adsAmt>0.5?0.6:1)*slotMul(p)*(p.healT>0?0.5:1)*p.spdMul;
  const ox=p.x, oz=p.z;
  p.slideCD-=dt;
  if(p.dashT>0){ p.dashT-=dt; moveEntity(p,p.ddx*24*dt,p.ddz*24*dt); }
  else if(p.slideT>0){
    p.slideT-=dt;
    const t=1-Math.max(0,p.slideT)/SLIDE_TIME, ssp=SLIDE_START*(1-t)+SLIDE_END*t;
    if(!moveEntity(p,p.sdx*ssp*dt,p.sdz*ssp*dt)) p.slideT=Math.min(p.slideT,0.08);
    if(Math.random()<0.6) emit(p.x+p.sdx*0.5,0.05,p.z+p.sdz*0.5,0x8a8070,2,1.5,4);
  } else if(l>0) moveEntity(p,mx/l*sp*dt,mz/l*sp*dt);
  p.crouch+=((p.slideT>0?1:ducking?0.7:0)-p.crouch)*Math.min(1,dt*14);
  p.slideFov=(p.slideFov||0)+((p.slideT>0?1:0)-(p.slideFov||0))*Math.min(1,dt*14);
  p.height=1.88-0.85*p.crouch;
  p.vx=(p.x-ox)/dt; p.vz=(p.z-oz)/dt;
  const imp=physY(p,dt);
  if(imp>3){ sfxLand(p,imp); shake=Math.max(shake,clamp(imp/40,0,0.3)); kick=Math.min(0.15,kick+imp*0.004); }
  if(l>0&&p.onGround&&p.slideT<=0){ const ob=bobT; bobT+=dt*(sp>6?13:10);
    if(Math.floor(ob/Math.PI)!==Math.floor(bobT/Math.PI)) sfxStep(p,ducking?0.05:sp>6?0.16:0.1,p.y>0.5); }
  if(p.switchT<=0&&p.healT<=0){
    if(p.slot===0&&mouseDown) fire(p);
    if(p.slot===1&&mouseDown) swing(p);
    if(p.slot===2&&clickQ) useUtil(p);
  }
  clickQ=false;
}

function findCover(ai,threat){
  let best=null,bs=1e9;
  for(let i=0;i<grid.length;i++){ if(!grid[i]) continue;
    const pt={x:(i%GW)*CS+CS/2,z:((i/GW)|0)*CS+CS/2}, d=dist(ai,pt); if(d>16) continue;
    if(los(pt,threat)) continue; const sc=d-dist(pt,threat)*0.3; if(sc<bs){bs=sc;best=pt;} }
  return best;
}
function aiUtil(ai,see,d){
  const u=ai.util, p=player; if(ai.utilCount<=0||ai.utilCD>0||ai.healT>0) return;
  switch(u.kind){
    case 'medkit': if(ai.hp<55&&(!see||Math.random()<0.2)) useUtil(ai); break;
    case 'grenade': case 'molotov': case 'flash': {
      const tg=see?{x:p.x,z:p.z}:ai.lastSeen; if(!tg) break;
      const dd=dist(ai,tg); if(dd<5||dd>20) break;
      if((!see&&ai.unseenT>(ai.hunter?0.6:1.2)&&Math.random()<(ai.hunter?0.85:0.5))||(see&&Math.random()<0.12)) useUtil(ai,tg); break; }
    case 'smoke': if(see&&ai.hp<50&&Math.random()<0.5) useUtil(ai,{x:(ai.x*2+p.x)/3,z:(ai.z*2+p.z)/3}); break;
    case 'mine': if((ai.reloadT>0||ai.coverT>0)&&Math.random()<0.5) useUtil(ai,{x:ai.x+Math.cos(ai.angle)*2,z:ai.z+Math.sin(ai.angle)*2}); break;
    case 'pad': if(!see&&ai.unseenT>2&&Math.random()<0.15) useUtil(ai); break;
  }
}
// 取りに行くアイテムを選ぶ（HPが減っていれば回復、中央の強アイテムは相手より近ければ奪いに行く）
function aiPickGoal(ai,see,d){
  if(sel.diff===0&&Math.random()<0.6) return null;

    const da=dist(ai,pk), dp=dist(player,pk);
    const want=pk.kind==='hp'?ai.hp<ai.maxHp*0.6 : pk.kind==='armor'?ai.shield<20&&da<18 : (da<dp+4||!see);
    if(want&&da<bs){ bs=da; best=pk; } }
  return best;
}

// ================= 弾・爆発 =================
function solidAt(x,y,z){
  if(x<0||x>AW||z<0||z>AD) return y<4.2?{perim:true}:null;
  return WALLS.find(w=>x>w.x&&x<w.x+w.w&&z>w.z&&z<w.z+w.d&&y<w.h)||null;
}
function surface(hit,b,nx,ny,nz){
  const p={x:nx,y:ny,z:nz}, n={x:0,y:0,z:0};
  if(hit.perim){ if(nx<0){n.x=1;p.x=0;}else if(nx>AW){n.x=-1;p.x=AW;}else if(nz<0){n.z=1;p.z=0;}else{n.z=-1;p.z=AD;} }
  else { const w=hit;
    if(b.x<=w.x){n.x=-1;p.x=w.x;} else if(b.x>=w.x+w.w){n.x=1;p.x=w.x+w.w;}
    else if(b.z<=w.z){n.z=-1;p.z=w.z;} else if(b.z>=w.z+w.d){n.z=1;p.z=w.z+w.d;}
    else {n.y=1;p.y=w.h;} }
  return {p,n};
}
function damage(e,amt,head,silent=false,src=null){

  amt*=e.armor;

  e.hp-=amt; e.hitT=0.15; e.lastHitT=0;

  if(e.hp<=0) e.killedByHead=!!head;
  if(src&&src!==e&&src.lifesteal&&src.hp>0) src.hp=Math.min(src.maxHp,src.hp+amt*src.lifesteal);

        const ax=player.x-rival.x, az=player.z-rival.z, s=Math.random()<0.5?1:-1; tryBoost(rival,-az*s,ax*s); } } }

// ダメージ数字（散弾は1つにまとめる）

function stepBullet(b,dt){

      if(e.hp<=0||(e===b.owner&&!b.bounced)) continue;
      const ry=b.y-e.y;
      if(Math.hypot(b.x-e.x,b.z-e.z)<e.r&&ry>0&&ry<e.height){
        if(b.explode){ explode(b.x,b.y,b.z,b); return false; }
        const head=ry>e.height-0.33;
        if(e.isTarget){ prac.hits++; if(head) prac.heads++; sfxTargetHit(e,head); }
        damage(e,b.dmg*(head?b.owner.headMul:b.owner.bodyMul),head,false,b.owner);
        emit(b.x,b.y,b.z,e.isTarget?0xd8c8a0:e===rival?0xff2a2a:0xff5555,10,3); return false; } }
  }

}
function updateBullets(dt){
  for(const b of bullets){
    b.alive=b.life>0&&stepBullet(b,dt); b.life-=dt;
    if(b.alive){ const len=clamp(b.trav-0.8,0,b.tl), sp=Math.hypot(b.vx,b.vy,b.vz);
      b.mesh.visible=len>0.05; b.mesh.scale.set(b.thick,b.thick,len);
      b.mesh.position.set(b.x-b.vx/sp*len/2,b.y-b.vy/sp*len/2,b.z-b.vz/sp*len/2); b.mesh.lookAt(b.x,b.y,b.z);
      if(b.smoke){ emit(b.x,b.y,b.z,0xff7a30,2,0.8,-1); emit(b.x,b.y,b.z,0x3a3a3a,1,0.4,-1.5); } }
    else scene.remove(b.mesh);

}

    ovbox.innerHTML=`<h1 style="font-size:44px;color:#eee">${practice?'射撃練習':on?'メニュー':'一時停止中'}</h1>${on?'<p style="color:#ffd166">⚠ オンライン対戦中は時間が止まりません</p>':''}<div class="go">クリックで${on?'戻る':'再開'}</div>
    ${practice?`<button class="pbtn" id="pracSwap">🔫 銃を持ち替え（${KL('pgun')}）</button><button class="pbtn" id="pracExit">練習を終える</button>`:''}
    <button class="pbtn" id="pauseKeys">⌨ キー設定</button><button class="pbtn" id="toTitle">🏠 ${on?'対戦をやめてタイトルへ':'タイトルに戻る'}</button>`;
    $('pauseKeys').onclick=ev=>{ ev.stopPropagation(); openKeys('pause'); };
    $('toTitle').onclick=ev=>{ ev.stopPropagation(); if(practice||confirm(on?'オンライン対戦をやめてタイトルに戻りますか？':'試合を中断してタイトルに戻りますか？\n（この試合のカギはもらえません）')) goTitle(); };
    if(practice){ $('pracExit').onclick=ev=>{ ev.stopPropagation(); endPractice(); };
      $('pracSwap').onclick=ev=>{ ev.stopPropagation(); cyclePracticeGun(); }; } }
  if(kind==='gameover'){ const win=score.p>score.r;
    ovbox.innerHTML=`<img src="${charaThumbURL()}" style="height:150px;display:block;margin:0 auto -6px;filter:${win?'drop-shadow(0 0 14px #4cc9f0)':'grayscale(.6) brightness(.8)'}">
    <h1 style="color:${win?'#4cc9f0':'#ff4d6d'}">${win?'勝利！':'敗北…'}</h1>
    <p style="font-size:28px;font-weight:800">${score.p} - ${score.r}</p>
    <p>${isOnline()?`🌐 ${rivalName()} とのオンライン対戦`:`${rivalName()}「${win?lines().matchLose:lines().matchWin}」`}</p>
    ${lastReward?`<div class="reward">🔑 +${lastReward.got}<small>${lastReward.rounds?`取ったラウンド ${lastReward.rounds}本`:'参加賞'}${lastReward.bonus?`＋勝利ボーナス ${lastReward.bonus}本（${diff().name}）`:''}${lastReward.extra?`＋PERFECTボーナス ${lastReward.extra}本`:''}　→ 所持 ${prog.keys}本</small></div>`:''}
    <div class="go">${net&&net.peer?`クリックして ${rivalName()} ともう一度`:'クリックして再戦（ステージ選択へ）'}</div>
    ${net&&net.peer?'<button class="pbtn" id="netEnd">オンライン対戦を終わる</button>':''}`;
    if(net&&net.peer) $('netEnd').onclick=ev=>{ ev.stopPropagation(); goTitle(); }; }
}
const hudCache={bf:null,rb:null,pr:null};
function updatePracHUD(){
  const acc=prac.shots?Math.round(prac.hits/prac.shots*100):0, w=player.weap, best=pracBest[w.name]||0;
  const h=`<div class="pt">🎯 射撃練習　<span style="color:${w.color}">${w.name}</span>${isOpen(w)?'':'<small style="color:#ffd166">（お試し）</small>'}</div>
    <div>命中率 <b>${acc}%</b>　撃破 <b>${prac.kills}</b>　ヘッドショット <b>${prac.heads}</b>　ダメージ <b>${Math.round(prac.dmg)}</b></div>
    ${prac.chal?`<div class="pc">残り <b>${prac.t.toFixed(1)}</b> 秒　スコア <b>${prac.score}</b>　ベスト ${best}</div>`:`<div class="ph">${KL('chal')}：60秒チャレンジ（ベスト ${best}点）　${KL('pgun')}：銃を持ち替え　${KL('dash')}：ダッシュ　ESC：メニュー</div>`}`;
  if(h!==hudCache.pr){ hudCache.pr=h; $('prac').innerHTML=h; }
}
function updateHUD(){
  const p=player, wp=p.weap;
  $('sp').textContent=score.p; $('sr').textContent=score.r; $('rnd').textContent='ラウンド '+round;
  const rItem=[rival.weap,rival.melee,rival.util][rival.slot]; $('rwn').textContent=rItem.name; $('rwn').style.color=rItem.color||'#ddd';
  $('rhp').style.width=Math.max(0,rival.hp/rival.maxHp*100)+'%'; $('php').style.width=Math.max(0,p.hp/p.maxHp*100)+'%'; $('phpnum').textContent=Math.max(0,Math.ceil(p.hp))+(p.maxHp!==100?` / ${p.maxHp}`:'');
  $('psh').style.width=p.shield/50*100+'%';
  const dp=`${'<i></i>'.repeat(p.dashCharges)}${'<i class="e"></i>'.repeat(DASH_MAX-p.dashCharges)}`;
  if(dp!==hudCache.dp){ hudCache.dp=dp; $('dashpips').innerHTML=dp; }
  for(let i=0;i<3;i++){ const s=$('slot'+i); if(s){ s.classList.toggle('on',p.slot===i); if(i===0) s.classList.toggle('off',p.noGun); } }
  const inf=p.infAmmo||p.infT>0;
  const c0=$('slotc0'), c2=$('slotc2'); if(c0) c0.textContent=p.reloadT>0?'…':inf?'∞':p.ammo; if(c2) c2.textContent='×'+p.utilCount;
  // 効果中のアイテムと強化
  const bf=(p.shield>0?`<span style="color:#7bdff2">🛡️ ${Math.ceil(p.shield)}</span>`:'')+(p.boostT>0?`<span style="color:#ff4d6d">💥 ${Math.ceil(p.boostT)}</span>`:'')+(p.infT>0?`<span style="color:#ffd166">⚡ ${Math.ceil(p.infT)}</span>`:'')
    +matchPerks.p.map(k=>`<span title="${k.name}">${k.icon}</span>`).join('');
  if(bf!==hudCache.bf){ hudCache.bf=bf; $('buffs').innerHTML=bf; }
  const rb=(rival.shield>0?'🛡️':'')+(rival.boostT>0?'💥':'')+(rival.infT>0?'⚡':'')+matchPerks.r.map(k=>k.icon).join('');
  if(rb!==hudCache.rb){ hudCache.rb=rb; $('rbuf').textContent=rb; }
  if(p.slot===0){ $('wname').textContent=wp.name; $('wname').style.color=wp.color; $('ammo').innerHTML=p.reloadT>0?'<small>リロード中…</small>':inf?'∞<small> 無限</small>':`${p.ammo}<small> / ${wp.mag}</small>`; }
  else if(p.slot===1){ $('wname').textContent=p.melee.name; $('wname').style.color='#ddd'; $('ammo').innerHTML=p.melee.dash?(p.dashCD>0?'<small>踏み込み準備中</small>':'<small>右クリック：踏み込み</small>'):'<small>近接</small>'; }
  else { $('wname').textContent=p.util.name; $('wname').style.color='#ddd'; $('ammo').innerHTML=p.healT>0?'<small>回復中…</small>':`×${p.utilCount}`; }
  $('hitmark').style.opacity=hitmarkT>0?1:0;
  $('vignette').style.opacity=Math.max(hurt*0.8,p.hp<35&&p.hp>0?0.35+Math.sin(performance.now()/250)*0.1:0,p.hp<=0?0.8:0);
  $('heal').style.opacity=p.healT>0?0.6:0;
  $('flash').style.opacity=Math.min(1,p.blindT/1.2);
  const scoped=p.slot===0&&wp.name==='スナイパー'&&adsAmt>0.85&&state==='fight';
  $('scope').style.display=scoped?'block':'none';
  $('cross').style.display=(adsAmt>0.6||p.hp<=0)?'none':'block';
  return scoped;
}

// ================= メインループ =================
function tickFighter(e,dt){
  e.cool-=dt; e.hitT-=dt; e.meleeCD-=dt; e.swingT-=dt; e.utilCD-=dt; e.switchT-=dt; e.blindT-=dt; e.dashCD-=e===player?dt:0;
  if(e.reloadT>0){ e.reloadT-=dt; if(e.reloadT<=0){e.reloadT=0;e.ammo=e.weap.mag;} }
  if(e.dashCharges<DASH_MAX){ e.dashChargeT+=dt; if(e.dashChargeT>=DASH_RECHARGE){ e.dashChargeT=0; e.dashCharges++; } } else e.dashChargeT=0;
  e.dodgeCD-=dt;
  if(e.pendHit>0){ e.pendHit-=dt; if(e.pendHit<=0&&e.slot===1) meleeHit(e); }
  e.lastHitT+=dt; if(e.regen&&e.lastHitT>3&&e.hp>0&&e.hp<e.maxHp) e.hp=Math.min(e.maxHp,e.hp+e.regen*dt);
  if(e.boostT>0){ e.boostT-=dt; if(Math.random()<0.4) emit(e.x+rand(-0.3,0.3),e.y+rand(0.2,1.8),e.z+rand(-0.3,0.3),0xff3b5c,1,0.8,-1); }
  if(e.infT>0){ e.infT-=dt; if(Math.random()<0.3) emit(e.x+rand(-0.3,0.3),e.y+rand(0.2,1.8),e.z+rand(-0.3,0.3),0xffc23d,1,0.8,-1); }
  if(e.healT>0){ e.healT-=dt; if(Math.random()<0.3) emit(e.x,e.y+rand(0.3,1.6),e.z,0x40ff90,1,0.6,-1);
    if(e.healT<=0){ e.hp=Math.min(e.maxHp,e.hp+50); emit(e.x,e.y+1,e.z,0x40ff90,30,2,-1); if(e===player) beep(1000,0.2,0.1,'sine'); } }
  if(e.burstLeft>0){ e.burstT-=dt; if(e.burstT<=0){ if(e.ammo>0&&e.reloadT<=0&&e.hp>0&&e.slot===0){shootOnce(e);e.burstLeft--;e.burstT=0.07;} else e.burstLeft=0; } }
}
function update(dt){
  if(paused||inMenu()) return;
  stateT-=dt; hurt=Math.max(0,hurt-dt*2.5); shake=Math.max(0,shake-dt); hitmarkT-=dt; kick*=Math.pow(0.0005,dt);
  flashT-=dt; rivalFlashT-=dt; boomT-=dt;
  if(subT>0){subT-=dt; if(subT<=0) $('sub').style.display='none';}
  if(state==='countdown'){ showBanner(`${roundBanner()}<div class="big">${Math.ceil(stateT)}</div>`);
    if(stateT<=0){ state='fight'; showBanner('<div class="big" style="color:#ffd166">FIGHT!</div>'); setTimeout(()=>{if(state==='fight')hideBanner();},700); beep(880,0.25,0.15,'square'); } }
  if(state==='fight'&&practice){
    tickFighter(player,dt); updatePlayer(dt); updateBullets(dt); updateThrows(dt); updateZones(dt); updateTargets(dt);
    if(player.hp<player.maxHp) player.hp=Math.min(player.maxHp,Math.max(1,player.hp+40*dt));   // 練習中は倒れない
    updatePracHUD();
  } else if(state==='fight'&&isOnline()){
    tickFighter(player,dt); tickFighter(rival,dt);
    updatePlayer(dt); updateNetRival(dt); updateBullets(dt); updateThrows(dt); updateZones(dt); updatePickups(dt); netTick(dt);
  } else if(state==='fight'){
    tickFighter(player,dt); tickFighter(rival,dt);
    updatePlayer(dt); updateRival(dt); updateBullets(dt); updateThrows(dt); updateZones(dt); updatePickups(dt); trackHabits(dt); checkDeath();
  } else if(state==='roundEnd'){
    updateBullets(dt); updateThrows(dt); updateZones(dt);
    player.blindT-=dt;
    if(rival.hp<=0) rivalModel.pivot.rotation.z=Math.min(1.5,rivalModel.pivot.rotation.z+dt*3);
    if(player.hp<=0) deathCam=Math.min(1,deathCam+dt*2);
    if(stateT<=0){ hideBanner(); if(score.p>=3||score.r>=3){ state='gameover'; grantKeys(); showOverlay('gameover'); } else openPerk(); }
  }
  updateParts(dt); updateSparks(dt); updateDebris(dt);
}
function render(){
  const p=player, wp=p.weap;
  const wantAds=rightDown&&state==='fight'&&p.hp>0&&p.slot===0;
  adsAmt+=((wantAds?1:0)-adsAmt)*Math.min(1,1/60*14);
  killPunch=Math.max(0,killPunch-1/60*1.5);
  const targetFov=75+((wp.name==='スナイパー'?20:55)-75)*adsAmt+(p.slideFov||0)*9*(1-adsAmt)+(p.dashT>0?10:0)-killPunch*12;
  if(Math.abs(camera.fov-targetFov)>0.01){camera.fov+= (targetFov-camera.fov)*0.5; camera.updateProjectionMatrix();}
  const bob=Math.sin(bobT)*0.035*(1-adsAmt*0.8);
  camera.position.set(p.x+(Math.random()-0.5)*shake*0.1, p.y+1.62-p.crouch*0.8+bob-deathCam*1.25, p.z+(Math.random()-0.5)*shake*0.1);
  camera.rotation.set(pitch+kick*0.3,yaw,deathCam*0.9+(p.slideFov||0)*0.07);
  let scoped=false; if(!inMenu()){ scoped=updateHUD(); updateDmgNums(); }
  // 手持ちモデル
  if(vm){
    const sw=p.switchT>0?p.switchT/0.22:0, by=Math.abs(Math.cos(bobT))*0.012-deathCam*0.5-sw*0.35, bx=Math.sin(bobT)*0.008;
    vm.gun.visible=p.slot===0&&!scoped; vm.melee.visible=p.slot===1; vm.util.visible=p.slot===2&&(p.utilCount>0||p.utilCD>0);
    if(p.slot===0){ const g=vm.gun; g.position.lerpVectors(HIP,vm.ads,adsAmt); g.position.z+=kick*0.9; g.position.y+=by; g.position.x+=bx; g.rotation.set(kick*2.2,0,0);
      updateReloadAnim(g,p,wp); }
    else { if(vm.rhand) vm.rhand.visible=false; if(reloadAnim&&p.reloadT>0) reloadAnim.last=1-p.reloadT/wp.reload; }
    if(p.slot===1){ const t=p.swingT>0?1-p.swingT/(p.swingDur||0.3):1, t0=vm.lastT!=null&&vm.lastT<=t?vm.lastT:t; vm.lastT=t;
      const setPose=tk=>{ const ps=meleePose(p.melee.model,tk,p.swingDir||1); vm.melee.position.set(ps.p[0]+bx,ps.p[1]+by,ps.p[2]); vm.melee.rotation.set(ps.r[0],ps.r[1],ps.r[2]); };
      // 振りが速すぎて1フレームで刃が大きく動くので、間の位置も補って軌跡をなめらかにする
      const samp=[];
      if(p.swingT>0) for(let k=1;k<=5;k++){ const tk=t0+(t-t0)*k/5; if(tk<0.1||tk>0.5) continue; setPose(tk); samp.push(bladePts((5-k)/5)); }
      setPose(t); updateTrail(samp,p.melee.model); }
    else { vm.lastT=null; updateTrail([]); }
    if(p.slot===2){ const k=p.utilCD>0?Math.sin(clamp(1-p.utilCD/0.6,0,1)*Math.PI):0, hk=p.healT>0?0.08:0;
      vm.util.position.set(0.24-k*0.1+bx,-0.25+by+k*0.15+hk,-0.42-k*0.2); vm.util.rotation.set(0.2-k*1.2,0.6,0); }
    // 引き金：クリックしている間は人差し指が引き金を引き込む
    { const want=mouseDown&&state==='fight'&&p.slot===0&&p.hp>0&&p.switchT<=0?1:0; vm.pull+=(want-vm.pull)*(want>vm.pull?0.6:0.35);
      if(vm.trigF) vm.trigF.rotation.z=-0.75*vm.pull; for(const m of vm.trigM) m.position.x=m.userData.x0-0.007*vm.pull;
      vm.gun.rotation.x+=0.012*vm.pull; vm.gun.position.y-=0.002*vm.pull; }   // 握り込むと銃がわずかに沈む
    // クロスボウ：撃つと弦がバチンと前に戻って震え、矢が消える。リロードで弦を引くと手と一緒に弦が下がる
    if(vm.bow){ const B=vm.bow; let k;
      if(p.reloadT>0){ const t=1-p.reloadT/wp.reload; k=clamp((t-0.3)/0.25,0,1); for(const o of B.bolt) o.visible=t>=0.84; B.released=false; }
      else { k=B.released?0:1; for(const o of B.bolt) o.visible=!B.released; }
      B.relT+=1/60;
      if(B.released&&B.relT<0.03) k=1-B.relT/0.03;   // 一瞬で前へ
      const vib=B.released?Math.exp(-B.relT*12)*Math.sin(B.relT*110)*0.01:0;
      const nk=new THREE.Vector3().lerpVectors(BOW_REST,BOW_COCK,k); nk.y+=vib; nk.z+=vib*0.5;
      for(const s of B.str) setRod(s.m,s.tip,nk); }
    if(vm.spin) vm.spin.rotation.z+=mouseDown&&state==='fight'&&p.slot===0?0.6:0.05;
  }
  if(boomT>0){ const k=boomT/0.4; boomSprite.visible=true; boomSprite.scale.setScalar(boomR*2.2*(1.2-k)); boomSprite.material.opacity=k; boomLight.intensity=60*k; }
  else { boomSprite.visible=false; boomLight.intensity=0; }
  flashMesh.visible=flashT>0; flashMesh.rotation.z=Math.random()*6; flashLight.intensity=flashT>0?6:0;
  // ライバル
  const rm=rivalModel; rm.root.position.set(rival.x,rival.y,rival.z); rm.root.rotation.y=-rival.angle;
  const swg=Math.sin(rival.walk)*0.55; rm.legs[0].rotation.z=swg; rm.legs[1].rotation.z=-swg;
  rm.root.visible=!inMenu()&&!practice;
  for(const id of ['score','rivalbar']) $(id).style.display=practice?'none':'';
  if(practice) $('modtag').style.display='none';
  $('prac').style.display=practice&&!inMenu()?'block':'none';
  const rMel=rival.slot===1&&!!rm.melee;
  rm.gunG.visible=rival.slot===0; rm.gunArms.visible=!rMel; rm.upper.visible=rMel; if(rm.melee) rm.melee.visible=rMel;
  if(rMel){ const md=rival.melee.model, t=rival.swingT>0?1-rival.swingT/(rival.swingDur||0.3):1, t0=rm.lastT!=null&&rm.lastT<=t?rm.lastT:t; rm.lastT=t;
    const samp=[];
    if(rival.swingT>0&&rm.root.visible) for(let k=1;k<=5;k++){ const tk=t0+(t-t0)*k/5; if(tk<0.1||tk>0.5) continue; applyRivalPose(rm,rivalMeleePose(md,tk,rival.swingDir||1)); samp.push(rivalBladePts(rm,(5-k)/5/60)); }
    applyRivalPose(rm,rivalMeleePose(md,t,rival.swingDir||1)); rivalTrail(samp,md); }
  else { rm.lastT=null; rivalTrail([]); }
  if(rivalFlashT>0){ rm.muzzle.getWorldPosition(rivalFlash.position); rivalFlashLight.position.copy(rivalFlash.position); rivalFlash.visible=true; rivalFlashLight.intensity=8; }
  else { rivalFlash.visible=false; rivalFlashLight.intensity=0; }
  $('hud').style.display=inMenu()?'none':'block';
  renderer.render(scene,camera);
}
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
  let sc=1; if(slowT>0&&!paused){ slowT-=dt; sc=0.28+0.72*clamp(1-slowT/1.1,0,1)**3; }   // 決着の瞬間だけスロー
  update(dt*sc); render(); requestAnimationFrame(loop); }

loadStage(sel.stage<0?0:sel.stage);
player=makeFighter(4,AD/2,0,{gun:GUNS[0],melee:MELEES[0],util:UTILS[0]});
rival=makeFighter(AW-4,AD/2,Math.PI,{gun:GUNS[0],melee:MELEES[0],util:UTILS[0]});
const titleLoop=()=>{ if(state==='title'||state==='select'||state==='stage'){ const t=performance.now()/9000; yaw=t; pitch=-0.25; player.x=AW/2+Math.sin(t)*14; player.z=AD/2+Math.cos(t)*10; player.y=4; } requestAnimationFrame(titleLoop); };
titleLoop();
showOverlay('title');
document.getElementById('loading').remove();
requestAnimationFrame(loop);
</script>
